# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-patch-days: 7 # tu peux allonger spécifiquement le délai pour les patches
      semver-minor-days: 3
      semver-major-days: 0
    groups:
      # react and react-dom must always have the exact same version, so they move together.
      # Listed first: a dependency is assigned to the first group that matches it.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # @vitest/coverage-v8 etc. pin the exact vitest version, so they move together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Major updates are intentionally left out so each one gets its own PR to review.
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
