name: Coverage

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Generate coverage badge
        run: node scripts/generateCoverageBadge.mjs

      - name: Commit coverage badge if changed
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'badges/coverage.svg';
            if (!fs.existsSync(path)) {
              core.info('Badge file not found, skipping.');
              return;
            }
            const { data: current } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: context.ref,
            }).catch(() => ({ data: null }));

            const content = fs.readFileSync(path, 'base64');
            if (current && current.content === content) {
              core.info('Badge unchanged, skipping commit.');
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: update coverage badge',
              content,
              sha: current ? current.sha : undefined,
            });
            core.info('Coverage badge committed.');
